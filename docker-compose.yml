services:
  api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
